# ============================================================
# DATABASE SERVICE ONLY
# ============================================================
# PostgreSQL 16 + pgvector + pgAdmin
# Image: pgvector/pgvector:pg16 (pgvector pre-installed)
# Usage: docker-compose up -d
# Reset:  docker-compose down -v && docker-compose up -d
# ============================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: attendance-db-postgres
    env_file:
      - .env
    environment:
      # PostgreSQL configuration
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8"
      # Timezone
      TZ: Asia/Jakarta
    # -------------------------------------------------------
    # PostgreSQL tuning for pgvector / face recognition
    # -------------------------------------------------------
    # maintenance_work_mem : faster IVFFlat index build
    # max_parallel_maintenance_workers : parallel index creation
    # work_mem             : cosine similarity query performance
    # shared_buffers       : general cache (≈25% of RAM)
    # effective_cache_size : planner hint (≈75% of RAM)
    # -------------------------------------------------------
    command: >
      postgres
      -c shared_buffers=4GB
      -c work_mem=256MB
      -c maintenance_work_mem=2GB
      -c max_parallel_maintenance_workers=4
      -c effective_cache_size=12GB
      -c log_min_duration_statement=2000
    ports:
      - "${DOCKER_HOST_IP:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Init script — prefix 01_ ensures correct execution order
      # :ro = readonly, prevent accidental modification inside container
      - ./init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      # Persistent data storage
      - postgres_data:/var/lib/postgresql/data
    # Shared memory untuk PostgreSQL buffer management
    # Host RAM: 16GB → shared_buffers=4GB → shm_size minimal harus ≥ ~256MB
    # (PostgreSQL >= 9.3 pakai mmap, bukan POSIX shmem, jadi 512MB sudah cukup)
    shm_size: '512mb'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - pg_network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: attendance-db-pgadmin
    env_file:
      - .env
    environment:
      # pgAdmin configuration
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "${DOCKER_HOST_IP:-0.0.0.0}:${PGADMIN_PORT:-5050}:5050"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pg_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  pg_network:
    name: pg_network
    driver: bridge