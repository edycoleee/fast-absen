# ============================================================
# Nginx — kos-frontend (static React SPA)
# ============================================================
# Container ini HANYA melayani file statis hasil build React.
# Rate limit, security headers, dan gzip ditangani oleh
# kos-nginx (entrypoint) di upstream — tidak diulang di sini.
# ============================================================

server {
    listen 80;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Sembunyikan versi Nginx ───────────────────────────────
    server_tokens off;

    # ── SPA fallback ─────────────────────────────────────────
    # Semua path dikembalikan ke index.html agar React Router
    # dapat menangani client-side routing (BrowserRouter).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache asset statis 30 hari ───────────────────────────
    # Vite menghasilkan nama file dengan hash (mis. main.a1b2c3.js)
    # sehingga cache-busting otomatis saat deploy ulang.
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ── Blokir akses ke file tersembunyi (.git, .env, dll.) ──
    location ~ /\. {
        deny all;
        return 404;
    }
}
