# ============================================================
# NGINX – App Stack (192.10.10.152)
# ============================================================
# Port  : nginx mendengar di :80 dalam container
#         docker memetakan  0.0.0.0:3000 → container:80
# Upstream reverse proxy (192.10.10.15) meneruskan:
#   absen.sulfat.site → 192.10.10.152:3000 (HTTP)
# SSL ditangani oleh reverse proxy di 192.10.10.15.
# ============================================================

# ── Real IP: percayai header dari reverse proxy ───────────────
# $remote_addr akan berisi IP asli klien (bukan 192.10.10.15)
# setelah modul ngx_http_realip_module memproses header ini.
set_real_ip_from  192.10.10.15;
real_ip_header    X-Real-IP;
real_ip_recursive on;

# ── Rate limiting: lindungi endpoint API ─────────────────────
# Zone 10MB ≈ ~80.000 IP unik; maks 20 req/s per IP
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# ── Gzip compression ─────────────────────────────────────────
gzip            on;
# text/html sudah disertakan nginx secara default — jangan duplikasi
gzip_types      text/css application/javascript application/json
                image/svg+xml text/plain application/xml;
gzip_min_length 1024;
gzip_vary       on;
gzip_proxied    any;

# ── Custom log format (IP asli klien) ────────────────────────
log_format main_real '$remote_addr [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" real_ip=$http_x_real_ip';

server {
    listen 80;
    server_name absen.sulfat.site 192.10.10.152;

    client_max_body_size 10m;

    access_log /var/log/nginx/access.log main_real;
    error_log  /var/log/nginx/error.log  warn;

    # ── Security Headers ──────────────────────────────────────
    # CORS TIDAK diset di sini — ditangani penuh oleh FastAPI backend
    # agar tidak ada double-header yang menyebabkan error di Android/browser.
    add_header X-Frame-Options          "SAMEORIGIN"                       always;
    add_header X-Content-Type-Options   "nosniff"                          always;
    add_header X-XSS-Protection         "1; mode=block"                    always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"  always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://absen.sulfat.site; font-src 'self';"
        always;

    # ── Proxy headers diteruskan ke upstream ─────────────────
    # $remote_addr sudah berisi IP asli klien setelah real_ip module
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # ----------------------------------------------------------
    # HEALTH CHECK  →  backend:8000/health  (no rate limit)
    # ----------------------------------------------------------
    location ~ ^/health(/|$) {
        proxy_pass         http://backend:8000;
        proxy_read_timeout 10s;
    }

    # ----------------------------------------------------------
    # UPLOADS (foto pegawai)  →  backend:8000/uploads/
    # ----------------------------------------------------------
    location /uploads/ {
        proxy_pass         http://backend:8000/uploads/;
        proxy_read_timeout 30s;
        # cache foto di browser selama 7 hari
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ----------------------------------------------------------
    # BACKEND API  →  backend:8000
    # Rate limit: burst 40 req, antrian 20 req lalu tolak sisanya
    # ----------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        limit_req_status 429;

        proxy_pass         http://backend:8000/api/;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # WebSocket / SSE support
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }

    # ----------------------------------------------------------
    # FRONTEND SPA  →  frontend container (nginx:alpine)
    # ----------------------------------------------------------
    location / {
        proxy_pass         http://frontend:80/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
    }
}
