# =============================================================
# RSUD Sulfat Attendance System – Application Stack
# =============================================================
#
# Target server : 192.10.10.152 (app server)
# Database      : 192.10.10.151:5432 (separate DB server)
# Reverse proxy : 192.10.10.15  →  absen.sulfat.site → :3000
#
# Quick start:
#   1. Clone repo to /opt/fast-absen on 192.10.10.152
#   2. cd deploy && cp .env.example .env  (lalu sesuaikan jika perlu)
#   3. docker compose up -d --build
# =============================================================

services:

  # ── Backend (FastAPI) ──────────────────────────────────────
  backend:
    container_name: absen-backend
    build:
      context: ../backend
    env_file:
      - .env
    environment:
      # DB host ditimpa dari .env, tapi eksplisit di sini agar jelas
      POSTGRES_HOST: ${DB_HOST_IP}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      ENVIRONMENT: production
      DEBUG: "false"
      RELOAD: "false"
    volumes:
      - backend_models:/app/.insightface   # InsightFace model cache
      - backend_uploads:/app/uploads        # foto wajah
      - backend_logs:/app/logs
    networks:
      - app_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Frontend (React/Vite → nginx) ─────────────────────────
  frontend:
    container_name: absen-frontend
    build:
      context: ../frontend
      args:
        # Relative path: browser akan resolve ke origin saat ini
        # Cocok dengan fallback di config.js:
        #   import.meta.env.VITE_API_BASE_URL || `${window.location.origin}/api/v1`
        VITE_API_BASE_URL: /api/v1
    depends_on:
      - backend
    networks:
      - app_net
    restart: unless-stopped

  # ── Nginx (entry point, port 3000) ────────────────────────
  nginx:
    container_name: absen-nginx
    image: nginx:alpine
    ports:
      - "0.0.0.0:3000:80"    # reverse proxy (192.10.10.15) → :3000
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app_net
    restart: unless-stopped

# ── Volumes ──────────────────────────────────────────────────
volumes:
  backend_models:
  backend_uploads:
  backend_logs:

# ── Networks ─────────────────────────────────────────────────
networks:
  app_net:
    driver: bridge
