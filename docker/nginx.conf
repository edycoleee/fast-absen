# ============================================================
# NGINX - Cloudflare Tunnel
# ============================================================
# Domain  : kalijaga.fun
# SSL     : Cloudflare handles termination - NO SSL here
# Tunnel  : cloudflared → 127.0.0.1:8080 → this nginx
# ============================================================

server {
  listen 80;
  server_name kalijaga.fun;

  client_max_body_size 10m;

  # ----------------------------------------------------------
  # BACKEND API
  # ----------------------------------------------------------
  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
    proxy_buffering off;
  }

  # ----------------------------------------------------------
  # HEALTH CHECK
  # ----------------------------------------------------------
  location /health {
    proxy_pass http://backend:8000/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ----------------------------------------------------------
  # PGADMIN - /pgadmin/
  # ----------------------------------------------------------
  location /pgadmin/ {
    proxy_pass http://attendance-db-pgadmin:80/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Script-Name /pgadmin;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_redirect ~^/(.*)$ /pgadmin/$1;
  }

  # ----------------------------------------------------------
  # STATIC ASSETS - long cache (hashed filenames)
  # ----------------------------------------------------------
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_cache_bypass $http_pragma $http_authorization;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # ----------------------------------------------------------
  # FRONTEND - SPA catch-all
  # ----------------------------------------------------------
  location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_cache_bypass $http_upgrade;
    # Prevent caching index.html so browser always gets latest JS hash
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}