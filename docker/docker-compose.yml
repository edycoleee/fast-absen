# =============================================================
# RSUD Sulfat Attendance System – Application Stack
# =============================================================
#
# Prerequisites:
#   1. Start the database stack first:
#        cd ../database && docker-compose up -d
#      (creates the external network "pg_network")
#
#   2. Generate SSL cert (first time only):
#        cd docker && sh generate-self-signed.sh
#
#   3. Copy and fill backend env file:
#        cp ../backend/.env.example ../backend/.env
#      Then set POSTGRES_HOST=postgres and a real SECRET_KEY.
#
#   4. Build & start:
#        VITE_API_BASE_URL=https://192.10.10.154/api/v1 docker-compose up -d --build
# =============================================================

services:
  backend:
    container_name: fastapi-backend
    build:
      context: ../../backend
    env_file:
      - ../../backend/.env          # local overrides (passwords, secret key, ...)
    environment:
      # These always override .env so the container talks to the DB container
      POSTGRES_HOST: postgres
      INSIGHTFACE_MODEL_DIR: /app/.insightface
      ENVIRONMENT: production
      DEBUG: "false"
      RELOAD: "false"
    volumes:
      - backend_models:/app/.insightface  # InsightFace model cache (persistent)
      - backend_uploads:/app/uploads      # uploaded face photos
      - backend_logs:/app/logs
    networks:
      - app_net
      - pg_net                            # reach the DB container
    restart: unless-stopped

  frontend:
    container_name: vite-frontend
    build:
      context: ../../frontend
      args:
        # URL the browser uses to reach the API – goes through nginx
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://192.10.10.154/api/v1}
    depends_on:
      - backend
    networks:
      - app_net
    restart: unless-stopped

  nginx:
    container_name: reverse-proxy
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app_net
    restart: unless-stopped

volumes:
  backend_models:
  backend_uploads:
  backend_logs:

networks:
  app_net:
    driver: bridge
  pg_net:
    external: true
    name: pg_network         # created by database/docker-compose.yml
