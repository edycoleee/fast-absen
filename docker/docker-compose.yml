# =============================================================
# RSUD Sulfat Attendance System – Application Stack
# =============================================================
#
# Prerequisites:
#   1. Start the database stack first:
#        cd ../database && docker-compose up -d
#      (creates the external network "pg_network")
#
#   2. Ensure cloudflared tunnel is running on host pointing to
#      127.0.0.1:8080 for domain kalijaga.fun
#
#   3. Copy and fill backend env file:
#        cp ../backend/.env.example ../backend/.env
#      Then set POSTGRES_HOST=postgres and a real SECRET_KEY.
#
#   4. Build & start:
#        docker-compose up -d --build
# =============================================================

services:
  backend:
    container_name: fastapi-backend
    build:
      context: ../backend
    env_file:
      - ../backend/.env             # local overrides (passwords, secret key, ...)
    environment:
      # These always override .env so the container talks to the DB container
      POSTGRES_HOST: postgres
      INSIGHTFACE_MODEL_DIR: /app/.insightface
      ENVIRONMENT: production
      DEBUG: "false"
      RELOAD: "false"
    volumes:
      - backend_models:/app/.insightface  # InsightFace model cache (persistent)
      - backend_uploads:/app/uploads      # uploaded face photos
      - backend_logs:/app/logs
    networks:
      - app_net
      - pg_net                            # reach the DB container
    restart: unless-stopped

  frontend:
    container_name: vite-frontend
    build:
      context: ../frontend
      args:
        # URL the browser uses to reach the API – goes through nginx + cloudflare
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://kalijaga.fun/api/v1}
    depends_on:
      - backend
    networks:
      - app_net
    restart: unless-stopped

  nginx:
    container_name: reverse-proxy
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"   # cloudflared tunnel → localhost:8080
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - app_net
      - pg_net                  # reach attendance-db-pgadmin for /pgadmin/ proxy
    restart: unless-stopped

volumes:
  backend_models:
  backend_uploads:
  backend_logs:

networks:
  app_net:
    driver: bridge
  pg_net:
    external: true
    name: pg_network         # created by database/docker-compose.yml
